[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "halluspace"
version = "0.1.0"
description = "Hallucination space projection for Whisper (arXiv:2609.04561), minimal re-implementation"
requires-python = ">=3.9"
dependencies = ["openai-whisper>=20240930", "torch>=2.0", "jiwer>=3.0", "tqdm"]

[project.optional-dependencies]
vad = ["silero-vad>=5.1"]
plot = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools]
packages = ["halluspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
